[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-arch"
version = "0.1.0"
description = "A safety-first graphical Arch Linux installer"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7"]
license = "GPL-3.0-or-later"

[project.optional-dependencies]
test = ["pytest>=8"]
vm = ["pexpect>=4.9"]

[project.scripts]
easy-arch = "arch_gui_installer.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arch_gui_installer = ["profiles/*.lua", "profiles/*.conf", "profiles/*.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
